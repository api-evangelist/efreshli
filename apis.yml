aid: efreshli
name: Efreshli
description: >-
  Efreshli is a Cairo, Egypt based online home-furnishing and interior-design commerce platform
  founded in 2018 by Heba El Gabaly. The company lets consumers design and shop their space online,
  pairing an e-commerce catalog of furniture, decor, lighting, rugs, bedding, and kitchen and dining
  goods with AI-assisted room design tools, curated collections, a gift registry, an Efreshli Pro
  membership, and a B2B / trade program that connects a network of vendors and brands. Efreshli is
  backed by 500 Global, Algebra Ventures, Marakez, and angel investor Tarek Sakr. This profile is a
  company record in the API Evangelist network; Efreshli operates a consumer e-commerce web
  storefront and publishes no public developer API, SDK, or documentation surface at this time.
